<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">SIMADIS Icon</title>
  <desc id="desc">Circle building icon with check badge.</desc>
  <defs>
    <linearGradient id="g-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5BDD" />
      <stop offset="100%" stop-color="#0A49B3" />
    </linearGradient>
    <linearGradient id="g-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="88" fill="#FFFFFF" stroke="#0E5BDD" stroke-width="6" />

  <!-- Building -->
  <g transform="translate(54 46)" stroke="#0E5BDD" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M10 96 V40 H92 V96" />
    <path d="M51 6 L94 32 H8 Z" fill="#0E5BDD" />
    <rect x="14" y="50" width="16" height="16" fill="#0E5BDD" rx="2" />
    <rect x="40" y="50" width="16" height="16" fill="#0E5BDD" rx="2" />
    <rect x="66" y="50" width="16" height="16" fill="#0E5BDD" rx="2" />
    <rect x="14" y="70" width="16" height="16" fill="#0E5BDD" rx="2" />
    <rect x="40" y="70" width="16" height="16" fill="#0E5BDD" rx="2" />
    <rect x="66" y="70" width="16" height="16" fill="#0E5BDD" rx="2" />
    <rect x="40" y="84" width="16" height="20" fill="#0E5BDD" rx="2" />
  </g>

  <!-- Check badge -->
  <g transform="translate(110 110)" filter="url(#shadow)">
    <circle cx="38" cy="38" r="38" fill="url(#g-green)" />
    <path d="M24 38 L36 52 L56 26" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
