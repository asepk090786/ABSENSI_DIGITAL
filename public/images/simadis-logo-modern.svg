<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">SIMADIS - Sistem Manajemen Absensi Digital Sekolah</title>
  <desc id="desc">Modern logo for SIMADIS with building icon and check mark.</desc>
  <defs>
    <linearGradient id="g-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F3AAA" />
    </linearGradient>
    <linearGradient id="g-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <g transform="translate(20 20)">
    <!-- Icon container -->
    <circle cx="80" cy="80" r="68" fill="#EFF6FF" stroke="url(#g-blue)" stroke-width="4" />

    <!-- Building -->
    <g transform="translate(42 38)" stroke="url(#g-blue)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M18 84 V32 H76 V84" />
      <path d="M47 -2 L84 20 H10 Z" fill="url(#g-blue)" />
      <rect x="18" y="44" width="12" height="12" fill="url(#g-blue)" rx="2" />
      <rect x="40" y="44" width="12" height="12" fill="url(#g-blue)" rx="2" />
      <rect x="62" y="44" width="12" height="12" fill="url(#g-blue)" rx="2" />
      <rect x="18" y="62" width="12" height="12" fill="url(#g-blue)" rx="2" />
      <rect x="40" y="62" width="12" height="12" fill="url(#g-blue)" rx="2" />
      <rect x="62" y="62" width="12" height="12" fill="url(#g-blue)" rx="2" />
      <rect x="40" y="74" width="12" height="14" fill="url(#g-blue)" rx="2" />
    </g>

    <!-- Check badge -->
    <g transform="translate(96 96)" filter="url(#soft)">
      <circle cx="32" cy="32" r="32" fill="url(#g-green)" />
      <path d="M20 32 L30 42 L48 20" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(180 75)" fill="#0F172A">
    <text x="0" y="0" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="68" font-weight="800" fill="url(#g-blue)" letter-spacing="2">SIMADIS</text>
    <text x="2" y="44" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" letter-spacing="0.5">Sistem Manajemen</text>
    <text x="2" y="76" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" letter-spacing="0.5">Absensi Digital Sekolah</text>
  </g>
</svg>
